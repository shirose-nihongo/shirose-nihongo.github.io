<script>
/* Landing page publik: kunjungan pertama tanpa deep-link & tanpa riwayat login -> landing.html.
   Tidak mengubah auth/routing; PWA terpasang & pengguna yang pernah login tetap langsung ke aplikasi. */
(function(){try{
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  if (!location.hash && !standalone && !localStorage.getItem("shirose-returning")) location.replace("./landing.html");
}catch(e){}})();
</script>

<style>
:root{
  --navy:#161b36; --navy-2:#1f2650; --navy-3:#2a3270; --navy-4:#0d1024;
  --pink:#ef6a9a; --pink-light:#f58bb0; --pink-dark:#c8325a;
  --gold:#ffd700; --purple:#8b5cf6; --cyan:#22d3ee; --green:#10b981;
  --red:#ef4444; --orange:#f59e0b;
  --white:#ffffff; --off:#f6f4fa; --gray:#b9bfd9; --gray-dim:#7a80a0;
  --border:#2a3060; --border-light:#3a4080;
  --font-jp:'Shippori Mincho B1', 'Noto Serif JP', serif;
  --font-sans:'Zen Kaku Gothic New', 'Inter', system-ui, -apple-system, sans-serif;
  --shadow-glow: 0 0 30px rgba(239,106,154,.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:var(--font-sans);
  color:var(--white);
  background:
    radial-gradient(ellipse at 20% 30%, rgba(139,92,246,.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(239,106,154,.15) 0%, transparent 50%),
    linear-gradient(to bottom, var(--navy-4), var(--navy));
  min-height:100vh;
  overflow-x:hidden;
}
@media (max-width:768px){ body{font-size:18px;} }
@media (max-width:640px){
  body{font-size:19px;}
  h1{font-size:30px;}
  h2{font-size:26px;}
  h3{font-size:22px;}
  p{font-size:19px; line-height:1.55;}
  .panel{padding:18px 16px;}
}

/* ========== Mobile safe-area + touch targets ========== */
body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
@media (max-width:640px){
  .btn{min-height:52px; padding:14px 20px; font-size:18px;}
  .btn.sm{min-height:44px; padding:10px 16px; font-size:16px;}
  .chip{min-height:44px; font-size:17px;}
  input, select, textarea{min-height:52px; font-size:19px;} /* 16px+ prevents iOS zoom on focus */
  .opsi{min-height:80px; padding:22px 20px; font-size:24px;}
  table{font-size:19px;}
}
/* Hide scrollbars on horizontal carousels on mobile */
.hscroll{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;}
.hscroll::-webkit-scrollbar{display:none;}
.hscroll > *{scroll-snap-align:start; flex:0 0 auto;}

/* ===== Leaderboard: profil karakter ===== */
.lb-tap{cursor:pointer;transition:background .12s,transform .12s;} .lb-tap:hover{background:rgba(255,255,255,.07);} .lb-tap:active{transform:scale(.99);}
.lbp-ov{position:fixed;inset:0;z-index:300;background:rgba(10,8,28,.72);display:flex;align-items:center;justify-content:center;padding:16px;animation:lbpIn .15s ease-out;}
@keyframes lbpIn{from{opacity:0}to{opacity:1}}
.lbp-card{position:relative;width:min(380px,100%);max-height:92vh;overflow:auto;background:linear-gradient(160deg,#3b2f78,#251c52);border:2px solid var(--border);border-radius:20px;padding:18px 16px 16px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);}
.lbp-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer;}
.lbp-name{font:800 20px var(--font-sans);color:var(--pink-light,#f9a8c9);} .lbp-sub{font-size:13px;color:var(--gray);margin:2px 0 8px;}
.lbp-big{width:min(220px,60vw);margin:0 auto;} .lbp-big svg{width:100%;height:auto;display:block;}
.lbp-minis{display:flex;justify-content:center;gap:10px;margin-top:10px;}
.lbp-mini{width:78px;padding:8px 4px 6px;border-radius:14px;background:rgba(255,255,255,.07);} .lbp-mc svg{width:100%;height:auto;display:block;} .lbp-mini small{font-size:11px;color:var(--gray);}

/* ========== CHARACTER COMPANION + JURUS BURST (Part 24 + 25) ========== */
/* Small SVG/emoji avatar in a corner during Hafalan & Ujian. */
.companion{
  position:fixed; z-index:40; pointer-events:none;
  left:12px; bottom:calc(16px + env(safe-area-inset-bottom));
  width:88px; height:88px;
  display:flex; align-items:flex-end; justify-content:center;
  user-select:none;
}
@media (max-width:640px){
  .companion{width:64px; height:64px; left:8px; bottom:calc(12px + env(safe-area-inset-bottom));}
}
.companion .avatar{
  font-size:54px; line-height:1; filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));
  animation:compIdle 2.8s ease-in-out infinite;
}
@media (max-width:640px){ .companion .avatar{font-size:40px;} }
@keyframes compIdle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.companion .weapon{
  position:absolute; right:0; bottom:18px;
  font-size:28px; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));
  animation:weaponSway 3.4s ease-in-out infinite;
}
@media (max-width:640px){ .companion .weapon{font-size:22px; bottom:14px;} }
@keyframes weaponSway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.companion.cheer .avatar{animation:compCheer .6s ease-out;}
@keyframes compCheer{
  0%{transform:scale(1);}
  40%{transform:scale(1.25) translateY(-10px);}
  100%{transform:scale(1);}
}
.companion .aura{
  position:absolute; inset:-8px; border-radius:50%;
  opacity:.25; filter:blur(10px);
  animation:auraPulse 2.5s ease-in-out infinite;
}
@keyframes auraPulse{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.35;transform:scale(1.1)}}

/* Jurus burst (fires when the student gets a correct answer) */
.burst{
  position:fixed; inset:0; pointer-events:none; z-index:95;
  display:flex; align-items:center; justify-content:center;
}
.burst .burst-ring{
  width:200px; height:200px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.4) 0%, transparent 70%);
  animation:burstRing .8s ease-out forwards;
}
@keyframes burstRing{
  0%{transform:scale(.2); opacity:0;}
  30%{opacity:1;}
  100%{transform:scale(3); opacity:0;}
}
.burst .burst-text{
  position:absolute; font-family:var(--font-jp); font-weight:800;
  font-size:52px; letter-spacing:2px; text-align:center;
  text-shadow:0 2px 20px rgba(255,255,255,.6), 0 0 40px currentColor;
  animation:burstText .9s ease-out forwards;
}
@keyframes burstText{
  0%{transform:scale(.4); opacity:0;}
  35%{transform:scale(1.15); opacity:1;}
  65%{transform:scale(1); opacity:1;}
  100%{transform:scale(1.4); opacity:0;}
}
.burst .particle{
  position:absolute; width:8px; height:8px; border-radius:50%;
  background:currentColor; opacity:.9;
  animation:burstPart .9s ease-out forwards;
}
@keyframes burstPart{
  0%{transform:translate(0,0) scale(.6); opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) scale(0); opacity:0;}
}

/* ========== FLOATING BACK + HOME (always available on sub-pages) ========== */
.fab-nav{
  position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); right:16px;
  z-index:90; display:flex; flex-direction:column; gap:10px;
  transition:opacity .2s, transform .2s;
}
.fab-nav.hidden{opacity:0; pointer-events:none; transform:translateY(20px);}
.fab-nav .fab{
  width:52px; height:52px; border-radius:50%; cursor:pointer;
  background:linear-gradient(135deg,#ef6a9a,#c8325a); color:white; border:none;
  box-shadow:0 6px 18px rgba(0,0,0,.4), 0 0 0 2px rgba(255,255,255,.08);
  font-size:20px; font-weight:800; transition:transform .12s, box-shadow .12s;
  display:flex; align-items:center; justify-content:center;
}
.fab-nav .fab:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(239,106,154,.5);}
.fab-nav .fab:active{transform:translateY(0);}
.fab-nav .fab.home{background:linear-gradient(135deg,#ffd700,#c89300); color:#2a1810;}
@media (max-width:640px){
  .fab-nav{bottom:calc(14px + env(safe-area-inset-bottom)); right:14px;}
  .fab-nav .fab{width:48px; height:48px; font-size:18px;}
}

/* Anti tumpang-tindih: isi halaman selalu bisa di-scroll sampai di atas tombol melayang (Android & iPhone) */
#app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.panel, .contoh-item{max-width:100%; overflow-wrap:anywhere}
.fab-nav{max-width:calc(100vw - 20px)}

/* ========== PWA INSTALL BUTTON + iOS modal ========== */
.install-btn{
  display:none; align-items:center; gap:6px;
  background:linear-gradient(135deg,#10b981,#059669); color:white;
  border:none; padding:8px 14px; border-radius:999px;
  font-weight:800; font-size:12px; cursor:pointer; transition:all .2s;
  box-shadow:0 2px 12px rgba(16,185,129,.4);
}
.install-btn:hover{transform:translateY(-1px); box-shadow:0 4px 18px rgba(16,185,129,.6);}
.install-btn.visible{display:inline-flex;}
.install-btn::before{content:"⬇️";}
.ios-install-modal{
  position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:9999;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.ios-install-modal .card{
  background:var(--navy-2); border:1px solid var(--border);
  border-radius:16px; padding:24px; max-width:420px; width:100%;
  color:var(--white);
}
.ios-install-modal h3{margin-bottom:12px; color:var(--pink);}
.ios-install-modal ol{margin:12px 0 16px 20px; line-height:1.8;}
.ios-install-modal .shareicon{
  display:inline-block; vertical-align:middle;
  color:#0a84ff; font-size:18px;
}

/* ========== DEDICATED LOGIN PAGE (halaman kosong login/daftar) ========== */
.auth-page{
  min-height:70vh;
  display:flex; align-items:center; justify-content:center;
  padding:30px 16px;
}
.auth-card{
  width:100%; max-width:560px;
  background:linear-gradient(160deg, var(--navy-2), var(--navy));
  border:2px solid var(--pink); border-radius:24px;
  padding:40px 32px;
  box-shadow:0 20px 60px rgba(239,106,154,.4);
}
.auth-card .brand-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  font-family:var(--font-jp); font-size:38px; font-weight:800;
  color:var(--pink-light); margin-bottom:14px; text-align:center;
}
.auth-card .brand-row .rose{font-size:44px; color:var(--pink);}
.auth-card h2{
  color:var(--white); text-align:center;
  font-family:var(--font-jp);
  font-size:32px; margin-bottom:12px;
}
.auth-card .sub{
  text-align:center; color:var(--gray);
  margin-bottom:28px; font-size:20px; line-height:1.55;
}
.auth-card .form-group{margin-bottom:18px;}
.auth-card .form-group label{font-size:20px; font-weight:700; margin-bottom:10px;}
.auth-card .form-group input{
  font-size:22px; padding:18px 20px; min-height:60px; border-radius:12px;
}
.auth-card .btn{
  width:100%; margin-bottom:12px;
  font-size:22px; padding:18px; min-height:60px;
  justify-content:center;
}
.auth-err{
  color:var(--red); font-size:18px; margin-top:14px;
  text-align:center; min-height:24px; font-weight:600;
}
body.auth-mode .topbar{display:none !important;}
body.auth-mode #fab-nav{display:none !important;}
body.auth-mode #guru-link{display:none !important;}
body.auth-mode .companion{display:none !important;}
@media (max-width:640px){
  .auth-card{padding:30px 22px;}
  .auth-card .brand-row{font-size:30px;}
  .auth-card .brand-row .rose{font-size:36px;}
  .auth-card h2{font-size:26px;}
  .auth-card .sub{font-size:17px;}
  .auth-card .form-group label{font-size:18px;}
  .auth-card .form-group input{font-size:20px; padding:16px 18px; min-height:56px;}
  .auth-card .btn{font-size:20px; padding:16px; min-height:56px;}
}

/* ========== TOP BAR ========== */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:10px; padding:12px 16px;
  background:rgba(13,16,36,.9); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
@media (max-width:640px){ .topbar{padding:10px 12px; gap:8px;} }
.brand{
  display:flex; align-items:center; gap:8px; font-family:var(--font-jp); font-weight:800; font-size:22px;
  color:var(--white); text-decoration:none;
}
@media (max-width:640px){ .brand{font-size:18px; gap:6px;} }
.brand .rose{color:var(--pink); font-size:26px;}
.topbar-right{margin-left:auto; display:flex; gap:8px; align-items:center;}
.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:10px 16px; border-radius:999px;
  background:rgba(255,255,255,.08); border:1px solid var(--border);
  font-size:18px; font-weight:600; color:var(--white);
  cursor:pointer; transition:all .2s;
}
.chip:hover{background:rgba(255,255,255,.12); border-color:var(--pink);}
.chip.active{background:var(--pink); border-color:var(--pink); color:white;}
.chip .badge{background:var(--gold); color:#2a1810; font-size:15px; padding:4px 10px; border-radius:999px; font-weight:800;}
.chip .coin::before{content:"🪙"; margin-right:2px;}
.chip .lv::before{content:"⭐"; margin-right:2px;}
.chip .streak::before{content:"🔥"; margin-right:2px;}
.btn{
  background:var(--pink); color:white; border:none; padding:12px 22px; border-radius:10px;
  font-weight:700; cursor:pointer; font-family:var(--font-sans); font-size:19px;
  transition:all .15s; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{background:var(--pink-dark); transform:translateY(-1px); box-shadow:var(--shadow-glow);}
.btn.ghost{background:transparent; border:1px solid var(--border);}
.btn.ghost:hover{background:rgba(255,255,255,.06);}
.btn.danger{background:var(--red);}
.btn.gold{background:var(--gold); color:#2a1810;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}

/* ========== LEVEL PILL ========== */
.lvl-pill-group{display:flex; gap:4px; background:rgba(255,255,255,.05); padding:4px; border-radius:999px;}
.lvl-pill{
  padding:9px 18px; border-radius:999px; font-size:18px; font-weight:800; cursor:pointer;
  border:none; background:transparent; color:var(--gray); transition:all .15s;
  min-width:48px;
}
.lvl-pill:hover{color:var(--white);}
.lvl-pill.active{background:var(--pink); color:white;}
.lvl-pill.locked{color:#555; cursor:not-allowed;}
/* Lencana level aktif di topbar (bukan tombol ganti level) */
.lvl-badge{display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px;
  border:1px solid var(--pink); background:rgba(239,106,154,.12); color:var(--white);
  font-weight:800; font-size:16px; cursor:pointer; font-family:inherit;}
.lvl-badge .ganti{font-size:11px; font-weight:600; color:var(--pink-light); letter-spacing:.5px;}
.lvl-badge:hover{background:rgba(239,106,154,.25);}
body.pick-mode .lvl-pill-group{visibility:hidden;}
@media (max-width:520px){ .lvl-badge{padding:6px 12px; font-size:14px;} .lvl-badge .ganti{display:none;} }
/* tombol ⚙ Pengaturan hanya di HP */
.mset-wrap{display:none;}
/* Topbar HP: tidak boleh melebar keluar layar (tanpa scroll horizontal) */
@media (max-width:560px){
  .topbar{flex-wrap:wrap; row-gap:6px;}
  /* HP: nama akun (btn-auth) + tombol keluar naik ke baris atas, di samping logo & level; sisanya (tema, font, chip) wrap di bawahnya */
  .topbar{padding-left:max(10px, env(safe-area-inset-left)); padding-right:max(10px, env(safe-area-inset-right)); column-gap:6px;}
  .topbar-right{display:contents;}
  .topbar > *, .topbar-right > *{order:5;}
  .topbar > .brand, .topbar > .lvl-pill-group, .topbar #btn-auth, .topbar #btn-out{order:1;}
  .topbar-right .chip{min-height:34px; font-size:14px; padding:4px 10px;}
  .topbar-right .install-btn{padding:6px 10px; font-size:12px;}
  #btn-auth{margin-left:auto; flex:0 1 auto; min-width:0; max-width:88px; min-height:0; height:36px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:4px 8px; font-size:12.5px;}
  #btn-out{flex:none; min-height:0; height:36px; padding:4px 8px !important;}
  .topbar .lvl-pill-group .lvl-badge{padding:5px 10px; font-size:13px;}
  .topbar .brand.logo{flex:none;}
  .topbar .lvl-pill-group{flex:0 1 auto; min-width:0;}
  /* menu tema/font/dll: lebar penuh layar HP (tidak kepotong kiri/kanan), menempel di bawah topbar */
  @media (min-width:400px){ #btn-auth{max-width:150px;} }
  .topbar .th-wrap{display:contents;}
  .topbar .th-wrap > #mb-btn{order:5;}
  .topbar .th-wrap > .th-btn:not(#mb-btn){display:none;}   /* tema/font/simpan: dibuka lewat tombol ⚙ Pengaturan */
  .topbar .th-wrap > #mb-btn{padding:6px 9px; min-height:34px;}
  #saran-btn,#teman-btn{display:none;}   /* di HP: lewat ⚙ Pengaturan */
  .topbar-right .chip{display:none;}   /* bintang/koin/streak: sudah ada di kartu profil, disembunyikan di HP */
  .topbar .sosmed-top a, .topbar a[class*="sm-"]{transform:scale(.9);}
  .mset-wrap{display:block; order:5; position:static;}
  .mset-btn{display:inline-flex; align-items:center; gap:4px; padding:6px 10px; font-size:13px; min-height:34px;}
  .mset-panel{display:none; position:absolute; left:8px; right:8px; top:calc(100% + 4px); z-index:81; background:var(--navy-2); border:1px solid var(--border-light); border-radius:14px; padding:6px; box-shadow:0 12px 30px rgba(0,0,0,.45);}
  .mset-panel.open{display:block;}
  .mset-panel button{display:flex; width:100%; align-items:center; gap:10px; background:none; border:0; color:var(--white); font:inherit; font-size:15px; padding:12px; border-radius:10px; cursor:pointer; text-align:left;}
  .mset-panel button:hover,.mset-panel button:active{background:var(--navy-3);}
  .mset-panel button[hidden]{display:none;}
  .topbar .th-menu{left:8px; right:8px; top:calc(100% + 4px); min-width:0; width:auto; max-width:none;}
  .brand:not(.logo) > span:last-child{display:none;}
}
html{overflow-x:hidden;}

/* ========== HALAMAN PEMILIHAN JLPT ========== */
.jlpt-pick{width:100%; max-width:1100px; margin:0 auto; padding:24px 16px 48px; box-sizing:border-box;}
.jlpt-pick .head{text-align:center; margin-bottom:26px;}
.jlpt-pick .head .jp{font-family:var(--font-jp); font-size:clamp(28px,5vw,44px); font-weight:800; color:var(--pink-light);}
.jlpt-pick .head h1{font-size:clamp(20px,3.4vw,30px); margin-top:6px; color:var(--white);}
.jlpt-pick .head p{color:var(--gray); margin-top:8px; font-size:clamp(14px,2vw,17px);}
.jlpt-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr)); gap:16px;}
.jlpt-card{touch-action:manipulation; -webkit-tap-highlight-color:transparent; position:relative; text-align:left; border-radius:22px; padding:22px 20px 20px; cursor:pointer;
  border:2px solid rgba(255,255,255,.08); color:var(--white); font-family:inherit;
  background:linear-gradient(160deg, var(--navy-2), var(--navy)); overflow:hidden;
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease; min-height:200px;
  display:flex; flex-direction:column; gap:6px;}
.jlpt-card::after{content:attr(data-kanji); position:absolute; right:-6px; bottom:-26px; font-family:var(--font-jp);
  font-size:110px; font-weight:800; opacity:.07; pointer-events:none;}
.jlpt-card .lv{font-size:44px; font-weight:900; letter-spacing:1px; line-height:1;}
.jlpt-card .jpname{font-family:var(--font-jp); font-size:18px; color:var(--pink-light); font-weight:700;}
.jlpt-card .desc{font-size:14px; color:var(--gray); line-height:1.5; flex:1;}
.jlpt-card .st{align-self:flex-start; font-size:12px; font-weight:800; padding:5px 12px; border-radius:999px;
  background:rgba(16,185,129,.18); color:#7ef0c3;}
@media (hover:hover){.jlpt-card:not(.locked):hover{transform:translateY(-4px); border-color:var(--pink); box-shadow:0 14px 36px rgba(239,106,154,.3);}}
.jlpt-card.current{border-color:var(--pink); box-shadow:0 0 0 3px rgba(239,106,154,.35);}
.jlpt-card.locked{cursor:not-allowed; filter:grayscale(.85); opacity:.55;}
.jlpt-card.locked .st{background:rgba(255,255,255,.08); color:var(--gray);}
.jlpt-card.n5{--acc:#10b981;} .jlpt-card.n4{--acc:#38bdf8;} .jlpt-card.n3{--acc:#8b5cf6;}
.jlpt-card.n2{--acc:#f59e0b;} .jlpt-card.n1{--acc:#ef4444;}

/* ========== MAIN LAYOUT ========== */

}
@media (max-width:640px){ .app{padding:10px; gap:10px;} }
@media (min-width:1024px){

}

/* ========== SHOP side-by-side (Parts 18 + 23) ========== */
.shop-tabs{
  display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;
}
.shop-tab{
  padding:10px 16px; border-radius:999px; cursor:pointer;
  background:rgba(255,255,255,.05); border:1px solid var(--border);

}
.shop-tab.on{background:var(--pink); border-color:var(--pink); color:white;}
.shop-tab:hover{color:var(--white); border-color:var(--pink-light);}

.shop-layout{
  display:grid; grid-template-columns:360px 1fr; gap:16px;
  margin-top:10px;
}
@media (max-width:860px){ .shop-layout{grid-template-columns:1fr;} }

.shop-preview{
  background:linear-gradient(160deg, rgba(42,50,112,.6), rgba(13,16,36,.6));
  border:1px solid var(--border); border-radius:16px;
  padding:16px; position:sticky; top:12px;
}
@media (max-width:860px){ .shop-preview{position:relative; top:auto;} }

.shop-body-pick{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:14px;color:var(--gray);flex-wrap:wrap}
.shop-char{
  width:100%; aspect-ratio:7/10; max-height:380px;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, rgba(239,106,154,.15), transparent 70%);
  border-radius:12px; margin-bottom:12px;
}
.shop-char svg{width:70%; height:100%; transition:transform .25s;}
@media (max-width:640px){ .shop-char{max-height:300px;} .shop-char svg{width:60%;} }

.shop-info{text-align:center; margin-bottom:12px;}
.shop-item-name{font-family:var(--font-jp); font-size:22px; font-weight:800; color:var(--pink-light); margin-bottom:6px;}
.shop-item-meta{display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--gray);}
.rarity-chip{
  padding:3px 10px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.5px;
}
.rarity-common{background:rgba(255,255,255,.1); color:var(--gray);}
.rarity-uncommon{background:rgba(16,185,129,.18); color:#10b981;}
.rarity-rare{background:rgba(34,211,238,.18); color:#22d3ee;}
.rarity-epic{background:rgba(139,92,246,.18); color:#8b5cf6;}
.rarity-legendary{background:rgba(255,215,0,.18); color:#ffd700;}
.rarity-mythic{
  background:linear-gradient(135deg, rgba(239,68,68,.25), rgba(255,215,0,.25));
  color:#fef3c7;
  border:1px solid rgba(255,215,0,.5);
  animation:mythicGlow 2s ease-in-out infinite;
}
@keyframes mythicGlow{0%,100%{box-shadow:0 0 6px rgba(255,215,0,.4)}50%{box-shadow:0 0 14px rgba(255,100,100,.7)}}

.shop-action{margin:12px 0 10px;}
.shop-wallet{text-align:center; font-size:14px; color:var(--gray);}

.shop-rchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}.shop-rchip{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer}.shop-rchip small{opacity:.8;font-weight:600}.shop-rchip.own{border-color:#ffd700}.shop-rchip.on{outline:2px solid #ffd700;box-shadow:0 0 12px #ffd70066}
.shop-sec{margin:18px 0 6px;font-size:14px;color:var(--gold,#ffd700);letter-spacing:.03em}.shop-sec small{color:var(--gray);font-weight:400}
.shop-items-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:10px; margin-top:8px;
}
.shop-tile{
  position:relative; background:rgba(42,50,112,.4); border:2px solid var(--border);
  border-radius:12px; padding:10px 8px; cursor:pointer;
  transition:transform .12s, border-color .15s, box-shadow .15s;
  text-align:center;
  content-visibility:auto; contain-intrinsic-size:auto 160px;   /* tile di luar layar tidak digambar → shop 100+ item tetap ringan */
}
.shop-tile:hover{border-color:var(--pink-light); transform:translateY(-2px);}
.shop-tile:active{transform:scale(.97);}
.shop-tile.sel{border-color:var(--gold); box-shadow:0 0 16px rgba(255,215,0,.35);}
.shop-tile.equipped{border-color:var(--green);}
.shop-tile.locked{opacity:.55;}
.shop-tile-thumb{

}
.shop-tile-thumb svg{width:70%; height:100%;}
.shop-tile-name{font-size:12px; font-weight:700; color:var(--white); margin-bottom:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.shop-tile-price{font-size:11px; color:var(--pink-light); font-weight:800;}
.shop-tile-rarity{
  position:absolute; top:6px; right:6px; width:12px; height:12px; border-radius:50%;
}

/* ========== LEADERBOARD (Part 15) ========== */
.lb-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.lb-chip{
  padding:8px 14px; border-radius:999px; cursor:pointer;
  background:rgba(255,255,255,.05); border:1px solid var(--border);
  color:var(--gray); font-weight:700; font-size:13px; min-height:36px;
  transition:all .15s;
}
.lb-chip.on{background:var(--pink); border-color:var(--pink); color:white;}
.lb-chip:hover{color:var(--white); border-color:var(--pink-light);}

.lb-list{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.lb-row{

  background:rgba(42,50,112,.4); border:1px solid var(--border);

.lb-meta{font-size:11px; color:var(--gray); margin-top:2px;}
.lb-score{text-align:right; min-width:80px;}
.lb-score{font-family:var(--font-jp); font-size:20px; font-weight:800; color:var(--pink-light);}

/* ========== HOME MINI CALENDAR + STREAK WIDGET ========== */
.streak-row{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:14px;}
.streak-pill{

.streak-pill .lbl{font-size:10px; color:var(--gray); margin-top:3px;}
.streak-pill.fire{border-color:rgba(239,106,154,.35);}
.streak-pill.trophy{border-color:rgba(255,215,0,.35);}

@media (max-width:640px){

  .streak-pill{padding:10px 8px; gap:8px;}

.mini-cal-head{display:flex; justify-content:space-between; align-items:center; margin:10px 0 8px;}
.mini-cal{

.mini-head{text-align:center; font-size:10px; color:var(--gray-dim); font-weight:800; padding:4px 0;}

}
.mini-cell:hover{transform:scale(1.08); z-index:2;}
.mini-cell .d{font-size:12px; font-weight:800; color:var(--white);}
.mini-cell.other{opacity:.25; cursor:default;}
.mini-cell.other:hover{transform:none;}
.mini-cell.today{outline:2px solid var(--pink);}
/* Heat palette — green → yellow → orange → red → fire */
.mini-cell.i1{background:rgba(16,185,129,.75);}                     /* sedikit */
.mini-cell.i2{background:rgba(234,179,8,.85);}                       /* sedang */
.mini-cell.i3{background:rgba(249,115,22,.9);}                       /* lumayan */
.mini-cell.i4{background:rgba(239,68,68,.95);}                       /* bagus */
.mini-cell.i5{
  background:linear-gradient(135deg, #ef4444, #f59e0b);
  box-shadow:0 0 12px rgba(239,68,68,.75), inset 0 0 8px rgba(255,215,0,.5);

@keyframes cellFire{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.cell-fire{

  filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));

}
@keyframes fireBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.mini-totals{

  font-size:13px; color:var(--gray);
}

/* ========== RPG DASHBOARD TITLE BLOCK ========== */
.journey-title{
  text-align:center; padding:12px 0 8px; margin-top:4px;
}
.journey-title .jp-title{
  font-family:var(--font-jp); font-weight:800;
  font-size:min(8vw, 34px); line-height:1.15;
  background:linear-gradient(135deg, var(--pink-light), var(--pink));

  color:var(--gray); font-size:min(3.2vw, 13px);
  letter-spacing:4px; margin-top:4px; font-weight:700;
}

/* ========== RPG DASHBOARD HOME — big, mobile-first ========== */
/* Desktop: orbit melingkar besar. HP (portrait/landscape): menu di KIRI &
   KANAN karakter, tidak melingkar. Ukuran tombol diperbesar ±2,5x. */
.rpg-stage{
  --R: min(400px, calc(46vw - 90px));
  --node: 156px;
  position:relative;
  min-height:calc(var(--R) * 2 + var(--node) + 20px);
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, rgba(139,92,246,.18), transparent 70%);
  border-radius:24px;
  padding:10px 0;
}
.chara-wrap{
  position:relative;
  width:min(26vw, 300px);
  aspect-ratio:7/10;
  display:flex; align-items:center; justify-content:center;
  z-index:2;
}
.chara-wrap svg{width:100%; height:100%;}

.orbit{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:calc(var(--R) * 2 + var(--node));
  height:calc(var(--R) * 2 + var(--node));
  pointer-events:none;
  animation: orbitSpin 120s linear infinite;
}
@keyframes orbitSpin{ from{transform:translate(-50%,-50%) rotate(0deg);} to{transform:translate(-50%,-50%) rotate(360deg);} }
.orbit .ring{position:absolute; inset:calc(var(--node) / 2); border-radius:50%; border:1px dashed var(--border); opacity:.5;}

.orbit-node, .side-node{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  cursor:pointer; color:var(--white); text-align:center;
  background:linear-gradient(135deg, rgba(31,38,80,.96), rgba(13,16,36,.96));
  border:2px solid var(--border);
  box-shadow:0 8px 28px rgba(0,0,0,.55);
  transition:border-color .2s, box-shadow .2s, filter .2s;
  -webkit-tap-highlight-color:transparent;
}
.orbit-node{
  position:absolute; top:50%; left:50%;
  width:var(--node); height:var(--node);
  margin:calc(var(--node) / -2) 0 0 calc(var(--node) / -2);
  border-radius:50%; pointer-events:auto; z-index:3;
  animation: orbitNodeCounter 120s linear infinite;
}
@keyframes orbitNodeCounter{ from{rotate:0deg;} to{rotate:-360deg;} }
.orbit-node:hover, .side-node:hover{border-color:var(--pink); box-shadow:0 0 28px rgba(239,106,154,.7); filter:brightness(1.12);}
.orbit-node:active, .side-node:active{filter:brightness(.92);}
.orbit-node .ico, .side-node .ico{font-size:54px; line-height:1;}
.orbit-node .jp, .side-node .jp{font-family:var(--font-jp); font-size:26px; font-weight:800; line-height:1;}
.orbit-node .lbl, .side-node .lbl{font-size:14px; font-weight:800; letter-spacing:1px; color:var(--pink-light); line-height:1;}

/* Kolom kiri/kanan — hanya dipakai di HP */
.side-col{display:none;}

@media (max-width:820px), (orientation:landscape) and (max-height:560px){
  .orbit{display:none;}
  .rpg-stage{
    min-height:0; display:grid; align-items:center; gap:10px; padding:10px 8px;
    grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);
  }
  .side-col{display:grid; gap:10px; grid-template-rows:repeat(4, 1fr); height:100%;}
  .side-node{border-radius:22px; padding:12px 6px; min-height:112px;}
  .side-node .ico{font-size:clamp(36px, 10vw, 54px);}
  .side-node .jp{font-size:clamp(18px, 5vw, 26px);}
  .side-node .lbl{font-size:clamp(11px, 3vw, 14px); letter-spacing:.5px;}
  .chara-wrap{width:100%; max-width:300px; justify-self:center;}
}
/* HP landscape: tiap sisi 2x2 supaya muat di tinggi layar yang pendek */
@media (orientation:landscape) and (max-height:560px){
  .rpg-stage{grid-template-columns:minmax(0,1fr) minmax(0,.7fr) minmax(0,1fr);}
  .side-col{grid-template-columns:1fr 1fr; grid-template-rows:repeat(2, 1fr);}
  .side-node{min-height:calc((100vh - 120px) / 2); max-height:170px;}
  .chara-wrap{max-height:calc(100vh - 110px); width:auto; height:calc(100vh - 110px);}
}

/* ========== PANEL (right column) ========== */
.panel{
  background:linear-gradient(180deg, var(--navy-2), var(--navy));
  border:1px solid var(--border); border-radius:20px; padding:22px;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}
@media (max-width:640px){ .panel{padding:18px 16px; border-radius:18px;} }
.panel h2{font-family:var(--font-jp); font-size:34px; margin-bottom:14px; color:var(--pink-light); font-weight:800; line-height:1.2;}
.panel h3{font-size:24px; margin:20px 0 12px; color:var(--white); font-weight:700;}
@media (max-width:640px){
  .panel h2{font-size:28px;}
  .panel h3{font-size:21px;}
}
.panel-close{float:right; background:transparent; border:none; color:var(--gray); font-size:24px; cursor:pointer; padding:0;}
.panel-close:hover{color:var(--pink);}

/* ========== HERO BAR (under topbar) ========== */
.herobar{
  display:flex; gap:12px; align-items:center;
  background:linear-gradient(90deg, rgba(31,38,80,.6), rgba(13,16,36,.3));
  border:1px solid var(--border); border-radius:16px;
  padding:12px 16px;
}
.herobar .avatar-mini{
  width:50px; height:50px; border-radius:50%;
  background:linear-gradient(135deg, var(--navy-3), var(--navy-2));
  border:2px solid var(--pink); display:flex; align-items:center; justify-content:center;
  font-size:24px; flex-shrink:0;
}
.herobar .info{flex:1; min-width:0;}
.herobar .info .nama{font-weight:800; font-size:14px;}
.herobar .info .meta{font-size:11px; color:var(--gray); margin-top:2px;}
.xp-bar{
  width:100%; height:8px; background:var(--navy-4); border-radius:4px; overflow:hidden; margin-top:6px;
}
.xp-fill{height:100%; background:linear-gradient(90deg, var(--pink), var(--gold)); transition:width .3s;}

/* ========== CARDS ========== */
.grid{display:grid; gap:12px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:640px){ .grid-3,.grid-4{grid-template-columns:repeat(2,1fr);} }

.card{
  background:linear-gradient(135deg, rgba(42,50,112,.4), rgba(31,38,80,.6));
  border:1px solid var(--border); border-radius:14px; padding:14px;
  transition:all .2s; cursor:pointer;
}
.card:hover{border-color:var(--pink); transform:translateY(-2px); box-shadow:0 10px 20px rgba(239,106,154,.2);}
.card .title{font-weight:800; font-size:14px; margin-bottom:4px;}
.card .desc{font-size:11px; color:var(--gray); line-height:1.4;}
.card .meta-row{display:flex; justify-content:space-between; margin-top:10px; font-size:11px;}

/* ========== Shop/Inventory item card ========== */
.item-card{
  position:relative;
  background:linear-gradient(145deg, rgba(42,50,112,.5), rgba(31,38,80,.7));
  border:2px solid var(--border); border-radius:12px;
  padding:8px; cursor:pointer; transition:all .15s;
  text-align:center;
}
.item-card:hover{border-color:var(--pink); transform:translateY(-3px);}
.item-card.owned{border-color:var(--green);}
.item-card.equipped{border-color:var(--gold); background:linear-gradient(145deg, rgba(255,215,0,.15), rgba(31,38,80,.7));}
.item-card.locked{opacity:.5; cursor:not-allowed;}
.item-card .icon-wrap{
  height:100px; display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
}
.item-card .icon-wrap svg{height:100%; width:auto;}
.item-card .nama{font-size:12px; font-weight:700; margin-top:4px; line-height:1.2;}
.item-card .harga{font-size:11px; color:var(--gold); margin-top:2px;}
.item-card .badge-rarity{
  position:absolute; top:4px; right:4px; font-size:9px; padding:2px 5px; border-radius:4px;
  font-weight:800; text-transform:uppercase; letter-spacing:.5px;
}
.rarity-common{background:#555;}
.rarity-uncommon{background:#10b981;}
.rarity-rare{background:#3b82f6;}
.rarity-legendary{background:#f59e0b; color:#2a1810;}
.rarity-mythic{background:linear-gradient(90deg, #ef6a9a, #8b5cf6); color:white;}

/* ========== Materi (kosakata/kanji/bunpou) ========== */
.search-bar{
  display:flex; gap:8px; margin-bottom:12px;
}
.search-bar input{
  flex:1; padding:10px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--navy-4); color:var(--white); font-size:14px; font-family:var(--font-sans);

.materi-list{display:grid; gap:14px; grid-template-columns:repeat(2, 1fr);}

  .materi-list{grid-template-columns:repeat(2, 1fr); gap:10px;}
}
.materi-item{
  background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:14px;
  padding:24px 18px; cursor:pointer; position:relative;

.materi-item .no-badge{

  font-family:var(--font-sans); font-size:20px; font-weight:700;
  color:var(--gray-dim); letter-spacing:.5px;
}
.materi-item .kanji{font-family:var(--font-jp); font-size:62px; font-weight:800; color:var(--pink-light); line-height:1.1;}
.materi-item .reading{font-size:28px; color:var(--gray); margin-top:10px; line-height:1.3;}
.materi-item .meaning{font-size:28px; margin-top:10px; line-height:1.35;}
@media (max-width:640px){
  .materi-item{padding:18px 14px;}
  .materi-item .no-badge{font-size:16px;}
  .materi-item .kanji{font-size:48px;}
  .materi-item .reading{font-size:22px;}
  .materi-item .meaning{font-size:22px;}
}
.no-pill{
  display:inline-block; padding:7px 18px; border-radius:999px;
  background:rgba(239,106,154,.14); color:var(--pink-light);
  font-family:var(--font-sans); font-size:20px; font-weight:700;
  letter-spacing:.8px; margin-bottom:12px;
}

/* ========== HAFALAN selection + session ========== */
.haf-topbar{
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
  gap:8px; margin-bottom:10px;
}
.haf-type-row{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
@media (max-width:640px){ .haf-type-row{grid-template-columns:1fr;} }
.haf-pick{
  background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:12px;
  padding:14px; cursor:pointer; color:var(--white); text-align:left;
  font-family:var(--font-sans); transition:all .15s;
}
.haf-pick:hover{border-color:var(--pink); transform:translateY(-1px);}
.haf-pick.on{border-color:var(--pink); background:rgba(239,106,154,.14); box-shadow:0 0 12px rgba(239,106,154,.25);}
.haf-pick .lbl{font-weight:800; font-size:23px;}
.haf-pick .sub{font-size:18px; color:var(--gray); margin-top:5px;}

.haf-chip-row{display:flex; flex-wrap:wrap; gap:12px;}
.haf-chip{
  padding:12px 22px; border-radius:999px;
  background:rgba(255,255,255,.05); border:1px solid var(--border);
  color:var(--gray); font-weight:700; font-size:19px; cursor:pointer;
  transition:all .15s; min-height:48px;
}
.haf-chip:hover{color:var(--white); border-color:var(--pink-light);}
.haf-chip.on{background:var(--pink); border-color:var(--pink); color:white;}

.haf-mode-row{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;}
@media (max-width:640px){ .haf-mode-row{grid-template-columns:1fr;} }
.haf-mode{
  background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:12px;
  padding:22px 16px; cursor:pointer; color:var(--white); text-align:center;
  font-family:var(--font-sans); transition:all .15s;
}
.haf-mode .ico{font-size:44px; margin-bottom:8px;}
.haf-mode .lbl{font-weight:800; font-size:22px;}
.haf-mode .sub{font-size:18px; color:var(--gray); margin-top:5px;}
.haf-mode:hover{border-color:var(--pink); transform:translateY(-1px);}
.haf-mode.on{border-color:var(--gold); background:rgba(255,215,0,.08); box-shadow:0 0 14px rgba(255,215,0,.25);}

/* Matching grid */
.match-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  margin-top:12px;
}
.match-col{display:flex; flex-direction:column; gap:8px;}
.match-item{
  position:relative; background:rgba(42,50,112,.4); border:1px solid var(--border);
  border-radius:10px; padding:12px; text-align:left; color:var(--white); cursor:pointer;
  font-family:var(--font-sans); transition:all .15s; min-height:60px;
}
.match-item:disabled{opacity:.4; cursor:default;}
.match-item .jp{font-family:var(--font-jp); font-size:34px; font-weight:800; color:var(--pink-light);}
.match-item .rd{font-size:20px; color:var(--gray); margin-top:6px;}
.match-item .id{font-size:22px; line-height:1.4;}
.match-item:hover:not(:disabled){border-color:var(--pink);}
.match-item.picked{border-color:var(--gold); background:rgba(255,215,0,.1);}
.match-item.match-ok{border-color:var(--green); background:rgba(16,185,129,.15); color:var(--green);}
.match-item.match-bad{border-color:var(--red); background:rgba(239,68,68,.15); animation:shakeX .3s;}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}


/* Pembahasan hafalan */
.haf-review-filter{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.haf-review-list{display:grid; gap:8px; max-height:60vh; overflow-y:auto; padding-right:2px;}
.haf-rv{border:1px solid var(--border); border-left-width:4px; border-radius:10px; padding:10px 12px; background:rgba(42,50,112,.3);}
.haf-rv.ok{border-left-color:var(--green);}
.haf-rv.retry{border-left-color:var(--gold);}
.haf-rv.bad{border-left-color:var(--red);}
.haf-rv.skip{border-left-color:var(--gray);}
.haf-rv-top{display:flex; align-items:center; gap:10px;}
.haf-rv-no{font-size:11px; color:var(--gray); min-width:22px;}
.haf-rv-jp{font-size:22px; font-weight:800; color:var(--pink-light); flex:1; min-width:0;}
.haf-rv-chip{font-size:11px; font-weight:800; white-space:nowrap; margin-left:auto;}
.haf-rv.ok .haf-rv-chip{color:var(--green);} .haf-rv.retry .haf-rv-chip{color:var(--gold);} .haf-rv.bad .haf-rv-chip{color:var(--red);}
.haf-rv-ans{font-size:13px; margin-top:6px;}
.haf-rv-wrong{font-size:12px; color:var(--gray); margin-top:3px;}

/* Multiple choice feedback */
.opsi.opsi-ok{border-color:var(--green); background:rgba(16,185,129,.18);}
.opsi.opsi-bad{border-color:var(--red); background:rgba(239,68,68,.18);}

/* ========== CALENDAR (Part 12) ========== */
.cal-hero{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  margin:10px 0 16px;
}
.cal-hero .cell{
  text-align:center; padding:14px 10px; border-radius:12px;
  background:rgba(42,50,112,.4); border:1px solid var(--border);
}
.cal-hero .num{font-family:var(--font-jp); font-size:38px; font-weight:800; color:var(--pink);}
.cal-hero .lbl{font-size:15px; color:var(--gray); margin-top:4px;}
.cal-nav{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.cal-grid{
  display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;
  background:rgba(13,16,36,.4); border:1px solid var(--border);
  border-radius:12px; padding:8px;
}
.cal-head{font-size:14px; color:var(--gray-dim); font-weight:700; text-align:center; padding:4px 0;}
.cal-cell{
  aspect-ratio:1/1; position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(255,255,255,.02); border-radius:8px;
  cursor:pointer; transition:all .15s;
}
.cal-cell.other-month{opacity:.3;}
.cal-cell.i1{background:rgba(16,185,129,.75);} .cal-cell.i2{background:rgba(234,179,8,.85);}
.cal-cell.i3{background:rgba(249,115,22,.9);}  .cal-cell.i4{background:rgba(239,68,68,.95);}
.cal-cell.i5{background:linear-gradient(135deg,#ef4444,#f59e0b); box-shadow:0 0 12px rgba(239,68,68,.6);}
.cal-cell.today{outline:2px solid var(--pink);}
.cal-cell:hover{background:rgba(255,255,255,.08); transform:translateY(-1px);}
.cal-cell .day{font-size:16px; font-weight:800; color:var(--white);}
.cal-cell .dots{display:flex; gap:2px; margin-top:4px;}
.cal-cell .dot{width:6px; height:6px; border-radius:50%;}
.dot-kanji{background:#ef6a9a;}
.dot-kosakata{background:#8b5cf6;}
.dot-latihan{background:#f59e0b;}
.dot-ujian{background:#10b981;}
.cal-legend{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--gray); align-items:center;}
.cal-legend span{display:inline-flex; gap:5px; align-items:center;}
.cal-legend .cl{display:inline-block; width:14px; height:14px; border-radius:4px;}
.cal-legend .cl.l1{background:rgba(16,185,129,.55);}
.cal-legend .cl.l2{background:rgba(234,179,8,.7);}
.cal-legend .cl.l3{background:rgba(249,115,22,.75);}
.cal-legend .cl.l4{background:rgba(239,68,68,.8);}
.cal-legend .cl.l5{background:linear-gradient(135deg,#ef4444,#f59e0b);}

/* ========== SYLABUS ========== */
.syl-hero{
  text-align:center; padding:22px; border-radius:16px;
  background:linear-gradient(135deg, rgba(239,106,154,.15), rgba(139,92,246,.15));
  border:1px solid var(--border);
}
.syl-hero-num{font-family:var(--font-jp); font-size:82px; font-weight:800; color:var(--pink);}
.syl-hero-lbl{color:var(--gray); font-size:24px; margin-top:8px;}
.syl-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; margin-top:16px;}
@media (max-width:640px){
  .syl-grid{grid-template-columns:repeat(2, 1fr); gap:10px;}
}
.syl-chunk{
  background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:12px;
  padding:22px 16px; cursor:pointer; transition:transform .12s, border-color .15s;
}
.syl-chunk:hover{transform:translateY(-2px); border-color:var(--pink);}
.syl-chunk.done{border-color:var(--green); background:rgba(16,185,129,.1);}
.syl-chunk-head{display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:12px; font-size:22px; flex-wrap:wrap; line-height:1.3;}
.syl-pct{color:var(--pink-light); font-weight:800; font-size:26px;}
.syl-chunk.done .syl-pct{color:var(--green);}
.syl-chunk-meta{font-size:19px; color:var(--gray); margin-top:12px; line-height:1.45;}
@media (max-width:640px){
  .syl-hero-num{font-size:66px;}
  .syl-hero-lbl{font-size:20px;}
  .syl-chunk{padding:16px 12px;}
  .syl-chunk-head{font-size:18px;}
  .syl-pct{font-size:22px;}
  .syl-chunk-meta{font-size:16px;}
}

/* ========== HAFALAN: status legend + preview list ========== */
.status-legend{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 8px;}
.stat-pill{
  display:inline-flex; align-items:center;
  padding:5px 10px; border-radius:999px;
  font-size:12px; font-weight:700;
}
.status-preview{
  margin:8px 0 12px; border:1px solid var(--border); border-radius:12px;
  background:rgba(13,16,36,.4); overflow:hidden;
}
.status-preview summary{
  padding:10px 14px; cursor:pointer; user-select:none;
  background:rgba(255,255,255,.04); font-size:13px;
}
.status-preview[open] summary{border-bottom:1px solid var(--border);}
.status-list{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:6px; padding:10px; max-height:340px; overflow-y:auto;
}
.status-item{
  position:relative;
  display:grid; grid-template-columns:auto 1fr auto; gap:8px;
  align-items:center;
  padding:10px 12px; border-radius:10px; border:1px solid;
  font-family:var(--font-sans);
}
.status-item .status-jp{
  font-family:var(--font-jp); font-weight:800; font-size:20px;
  color:var(--pink-light); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.status-item .status-mean{
  grid-column:1/-1; font-size:12px; color:var(--gray); line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
  -webkit-line-clamp:1; -webkit-box-orient:vertical;
}
.status-item .no-badge{position:static; font-size:10px;}
.status-item .status-chip{
  padding:3px 8px; border-radius:999px; border:1px solid;
  font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
  white-space:nowrap;
}
@media (max-width:640px){
  .status-list{grid-template-columns:1fr; max-height:260px;}
}

/* ========== FLASHCARD v2 — front-only until tap, then reveal ========== */
.flash-stage{
  position:relative; min-height:min(68vh, 520px);
  display:flex; align-items:center; justify-content:center;
  margin:10px 0 18px; overflow:visible;
  user-select:none; -webkit-user-select:none; touch-action:pan-y;
}
.flash-card{
  position:relative; width:100%; max-width:520px; height:clamp(380px, 62vh, 500px); min-height:0; overflow-x:hidden; overflow-y:auto; box-sizing:border-box;   /* ukuran kartu tetap, tidak berubah mengikuti isi */
  background:linear-gradient(160deg, rgba(42,50,112,.85), rgba(22,27,54,.85));
  border:1px solid var(--border); border-radius:24px;
  padding:32px 24px; text-align:center;
  box-shadow:0 12px 44px rgba(0,0,0,.4);
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease, opacity .25s ease;
  cursor:pointer;
  will-change:transform, opacity;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.flash-card .front{
  font-family:var(--font-jp); font-weight:800;
  font-size:min(22vw, 140px); line-height:1.05; color:var(--pink-light);
  font-size:min(22vw, 140px, calc(80cqw / var(--n, 1)));   /* kata panjang otomatis lebih kecil (sebelum JS menyesuaikan) */
  margin:14px 0 10px; word-break:break-all; max-width:100%; overflow-wrap:anywhere;
}
.flash-card .reading{
  display:inline-block; padding:8px 18px; border-radius:999px;
  background:rgba(42,50,112,.6); color:var(--white);
  font-family:var(--font-jp); font-size:26px; margin:10px 0 14px;
}
.flash-card .arti{
  font-size:22px; font-weight:700; color:var(--white);
  line-height:1.4; margin-top:8px;
}
@media (max-width:640px){
  .flash-card .reading{font-size:22px;}
  .flash-card .arti{font-size:20px;}
}
.flash-card .contoh{
  font-size:14px; color:var(--gray); margin-top:12px;
  padding:10px; background:rgba(255,255,255,.04); border-radius:10px;
  text-align:left;
}
.flash-card .tap-hint{
  margin-top:18px; font-size:13px; color:var(--gray-dim);
  letter-spacing:.3px;
  animation:fadeHint 1.6s ease-in-out infinite;
}
@keyframes fadeHint{0%,100%{opacity:.4}50%{opacity:.9}}
/* Reveal state: back face slides in */
.flash-card .back-face{display:none;}
.flash-card.revealed .back-face{display:block; animation:revealFade .25s ease-out;}
.flash-card.revealed .front{font-size:72px; margin-top:0;}
@media (max-width:640px){ .flash-card.revealed .front{font-size:58px;} }
.flash-card .say-btn{position:absolute; top:12px; right:12px; width:52px; height:52px; border-radius:50%;
  border:2px solid var(--border); background:rgba(255,255,255,.06); color:var(--white); font-size:24px; cursor:pointer; z-index:3;}
.flash-card .say-btn:active{transform:scale(.94);}
.flash-card .say-btn{display:none;}               /* suara hanya di sisi belakang */
.flash-card.revealed .say-btn{display:block;}
@keyframes revealFade{0%{opacity:0; transform:translateY(8px)}100%{opacity:1; transform:translateY(0)}}
.flash-card .th-key{display:none;}
@media (hover:hover) and (pointer:fine){ .flash-card .th-touch{display:none;} .flash-card .th-key{display:inline;} }
.flash-card.swiping{transition:none;}
.flash-card.leave-left{transform:translateX(-120%) rotate(-14deg); opacity:0;}
.flash-card.leave-right{transform:translateX(120%) rotate(14deg); opacity:0;}
.flash-card.enter{animation:flashEnter .35s ease-out;}
@keyframes flashEnter{
  0%{transform:translateY(16px) scale(.96); opacity:0;}
  100%{transform:translateY(0) scale(1); opacity:1;}
}
/* Swipe hint badges that fade in as the user drags */
.flash-badge{
  position:absolute; top:24px; padding:6px 16px; border-radius:8px;
  font-weight:800; font-size:14px; letter-spacing:1px;
  opacity:0; pointer-events:none; transition:opacity .15s;
  border:2px solid currentColor; text-transform:uppercase;
}
.flash-badge.left{left:20px; color:#ef5350; transform:rotate(-10deg);}
.flash-badge.right{right:20px; color:#10b981; transform:rotate(10deg);}

/* Three-button action row */
.flash-actions{
  display:grid; grid-template-columns:1fr auto 1fr; gap:10px; margin-top:8px;
}
.flash-btn{
  padding:20px 16px; border-radius:16px; border:none;
  font-weight:800; font-size:18px; cursor:pointer; font-family:var(--font-sans);
  transition:transform .12s, box-shadow .12s, filter .12s;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  min-height:76px;
}
.flash-btn .ico{font-size:24px;}
.flash-btn .sub{font-size:11px; opacity:.75; font-weight:600;}
.flash-btn.lupa{
  background:linear-gradient(135deg,#ef5350,#c62828); color:white;
  box-shadow:0 6px 18px rgba(239,83,80,.5);
}
.flash-btn.lupa:hover{transform:translateY(-2px); filter:brightness(1.08);}
.flash-btn.lupa:active{transform:scale(.97);}
.flash-btn.ingat{
  background:linear-gradient(135deg,#10b981,#059669); color:white;
  box-shadow:0 6px 18px rgba(16,185,129,.5);
}
.flash-btn.ingat:hover{transform:translateY(-2px); filter:brightness(1.08);}
.flash-btn.ingat:active{transform:scale(.97);}
.flash-btn.back{
  background:rgba(255,255,255,.08); color:var(--white);
  border:1px solid var(--border); padding:20px 22px;
}
.flash-btn.back:hover{background:rgba(255,255,255,.14); border-color:var(--pink);}
@media (max-width:640px){
  .flash-btn{font-size:16px; padding:18px 12px; min-height:84px;}
  .flash-btn .ico{font-size:22px;}
}

/* ========== Modals ========== */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(8px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:linear-gradient(160deg, var(--navy-2), var(--navy));
  border:1px solid var(--pink); border-radius:20px; padding:24px;
  width:100%; max-width:500px; max-height:90vh; overflow-y:auto;
  box-shadow:0 20px 60px rgba(239,106,154,.4);
}
.modal h2{font-family:var(--font-jp); color:var(--pink-light); margin-bottom:12px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block; font-size:19px; margin-bottom:8px; color:var(--gray); font-weight:600;}
.form-group input, .form-group select, .form-group textarea{
  width:100%; padding:16px 18px; border-radius:10px; border:1px solid var(--border);
  background:var(--navy-4); color:var(--white); font-family:var(--font-sans); font-size:21px;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{outline:none; border-color:var(--pink);}

/* ========== TOASTS ========== */
.toast-wrap{position:fixed; top:80px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:linear-gradient(135deg, var(--pink), var(--purple));
  color:white; padding:16px 22px; border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  font-weight:700; font-size:19px;
  animation: toastSlide .3s ease-out, toastOut .3s ease-in 2.7s forwards;
}
@keyframes toastSlide{from{transform:translateX(100%); opacity:0;} to{transform:translateX(0); opacity:1;}}
@keyframes toastOut{to{transform:translateX(100%); opacity:0;}}

/* ========== Loading ========== */
.loading{
  display:flex; align-items:center; justify-content:center; padding:40px;
  color:var(--gray); font-size:14px;
}
.loading::before{content:"⏳"; margin-right:8px; font-size:20px; animation:spin 1.5s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ========== LEVEL UP OVERLAY ========== */
.levelup-overlay{
  position:fixed; inset:0; background:radial-gradient(circle at center, rgba(239,106,154,.4), rgba(0,0,0,.9));
  display:none; align-items:center; justify-content:center; z-index:150;
  animation: lvup .3s ease-out;
}
.levelup-overlay.show{display:flex;}
@keyframes lvup{from{opacity:0; transform:scale(.8);} to{opacity:1; transform:scale(1);}}
.levelup-content{text-align:center;}
.levelup-content .text{
  font-family:var(--font-jp); font-size:60px; font-weight:800;
  background:linear-gradient(135deg, var(--gold), var(--pink));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 30px rgba(255,215,0,.5);
  animation: lvupText 2s ease-out;
}
@keyframes lvupText{0%{transform:scale(0) rotate(-180deg);} 50%{transform:scale(1.2) rotate(10deg);} 100%{transform:scale(1) rotate(0);}}
.levelup-content .lvl{font-size:30px; color:var(--white); margin-top:10px;}

/* ========== KANJI DETAIL ========== */
.kanji-detail{text-align:center; padding:24px;}
.kanji-detail .big-k{font-family:var(--font-jp); font-size:170px; font-weight:800; color:var(--pink); line-height:1;}
.kanji-detail .readings{display:flex; gap:16px; justify-content:center; margin:18px 0; flex-wrap:wrap;}
.kanji-detail .readings .r{background:rgba(42,50,112,.6); padding:14px 20px; border-radius:12px; font-size:24px;}
.kanji-detail .readings .r .lbl{font-size:18px; color:var(--gray); display:block; margin-bottom:4px;}
.contoh-list{text-align:left; margin-top:22px;}

<script>
/* mawar logo: ikut warna tema (--pink) lewat hue-rotate pada lapisan kelopak */
(function(){
  var BASE=337.5,r=document.documentElement;
  function sync(){
    try{
      var c=getComputedStyle(document.body).getPropertyValue("--pink").trim(),R,G,B,m;
      if((m=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c))){var h=m[1];if(h.length===3)h=h.replace(/./g,"$&$&");R=parseInt(h.substr(0,2),16);G=parseInt(h.substr(2,2),16);B=parseInt(h.substr(4,2),16)}
      else if((m=/rgba?\(([^)]+)\)/.exec(c))){var p=m[1].split(/[ ,\/]+/).map(parseFloat);R=p[0];G=p[1];B=p[2]}
      else return;
      R/=255;G/=255;B/=255;var mx=Math.max(R,G,B),mn=Math.min(R,G,B),d=mx-mn,hu=0;
      if(d){hu=mx===R?((G-B)/d)%6:mx===G?(B-R)/d+2:(R-G)/d+4;hu*=60;if(hu<0)hu+=360}
      var s=mx?d/mx:0;
      r.style.setProperty("--rose-hue",(hu-BASE).toFixed(1)+"deg");
      r.style.setProperty("--rose-sat",Math.max(0,Math.min(1.5,s/0.56)).toFixed(2));
      r.style.setProperty("--rose-br",Math.max(.35,Math.min(1.25,mx/0.94)).toFixed(2));
    }catch(e){}
  }
  sync();document.addEventListener("DOMContentLoaded",sync);window.addEventListener("load",sync);
  new MutationObserver(function(){setTimeout(sync,30)}).observe(r,{attributes:true,attributeFilter:["data-theme"]});
})();
</script>

/* ========== KOMENTAR (public per-item discussion) ========== */
// Render a placeholder div + schedule async load. The composite key is
// baked into the element id so a re-render replaces the right block.
function _commentsPlaceholder(tipe, lvl, no){
  const id = `cmts-${tipe}-${lvl}-${no}`;
  setTimeout(() => _loadComments(tipe, lvl, no, id), 0);
  return `<div class="comments-block" id="${id}">
    <h3>💬 Catatan & diskusi <span class="cmt-count">(memuat…)</span></h3>
  </div>`;
}
async function _loadComments(tipe, lvl, no, hostId){
  const host = document.getElementById(hostId);
  if (!host) return;
  let list = [];
  try { list = await FB.listKomentar(tipe, lvl, no); }
  catch(e){ /* non-fatal */ }

  const myUid = state.user?.uid;
  const canModerate = FB.userIsGuru();

  const itemsHtml = list.length ? list.map(c => {
    const isMine = myUid && c.uid === myUid;
    const canDel = isMine || canModerate;
    const when = c.created?.toDate ? c.created.toDate().toLocaleString("id-ID", { dateStyle:"short", timeStyle:"short" }) : "";
    return `
      <div class="cmt-item">
        <div class="cmt-head">
          <div>
            <span class="cmt-nama">${(c.nama||"Anon").toString().slice(0,40)}</span>
            <span class="cmt-meta">${c.jlpt ? `· ${c.jlpt.toUpperCase()}` : ""} ${c.kelas ? `· ${c.kelas}` : ""} ${when ? `· ${when}` : ""}</span>
          </div>
          ${canDel ? `<button class="cmt-delete" onclick="hapusKomentar('${tipe}','${lvl}',${no},'${c.id}','${c.uid||""}')">🗑 Hapus</button>` : ""}
        </div>
        <div class="cmt-text">${_escapeHtml(c.text||"")}</div>
      </div>`;
  }).join("") : `<p style="color:var(--gray-dim); font-size:13px;">Belum ada catatan. Jadi yang pertama!</p>`;

  const formHtml = state.user ? `
    <form class="cmt-form" onsubmit="submitKomentar(event, '${tipe}', '${lvl}', ${no}); return false;">
      <textarea id="cmt-input-${hostId}" placeholder="Tulis catatan, tips, atau pertanyaan tentang kata ini..." maxlength="1000"></textarea>
      <div class="cmt-form-row">
        <span style="color:var(--gray-dim); font-size:12px;">Catatan akan terlihat oleh semua pengguna.</span>
        <button class="btn gold" type="submit">💬 Kirim</button>
      </div>
    </form>
  ` : `<p style="color:var(--gray-dim); font-size:13px; margin-top:10px;">🔒 <a href="#" onclick="showAuthModal(); return false;" style="color:var(--pink);">Login</a> untuk menulis catatan.</p>`;

  host.innerHTML = `
    <h3>💬 Catatan & diskusi <span class="cmt-count">(${list.length})</span></h3>
    <div class="comments-list">${itemsHtml}</div>
    ${formHtml}
  `;
}
function _escapeHtml(s){
  return (s||"").toString()
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
window.submitKomentar = async (ev, tipe, lvl, no) => {
  ev.preventDefault();
  const host = document.getElementById(`cmts-${tipe}-${lvl}-${no}`);
  const txtEl = host?.querySelector("textarea");
  const text = txtEl?.value || "";
  if (!text.trim()) return toast("Teks kosong");
  try {
    await FB.tambahKomentar(tipe, lvl, no, text);
    toast("✓ Catatan terkirim");
    if (txtEl) txtEl.value = "";
    _loadComments(tipe, lvl, no, `cmts-${tipe}-${lvl}-${no}`);
  } catch(e){ toast("❌ " + e.message); }
};
window.hapusKomentar = async (tipe, lvl, no, id, ownerUid) => {
  if (!confirm("Hapus catatan ini?")) return;
  try {
    await FB.hapusKomentar(tipe, lvl, no, id, ownerUid);
    toast("✓ Dihapus");

};

/* ========== RANGKUMAN SENDIRI (personal word collection) ========== */
// Open a popup to add any word to the student's own Rangkuman. Pre-fills
// kana/arti via a dataset lookup when the user asks or when caller provides.
/* Bidang rangkuman: "ssw" | "jft" | "jlpt" — ditebak dari sumber / halaman / level aktif */
const RK_NAMA = { jlpt: "JLPT", ssw: "SSW", jft: "JFT" };
const RK_ROUTE = { jlpt: "rangkuman", ssw: "ssw-rangkuman", jft: "jft-rangkuman" };
window._rkBidangDari = (sumber) => {
  if (/ssw/i.test(String(sumber || ""))) return "ssw";
  const h = location.hash.slice(1);
  if (state.hafalan_ctx === "ssw" || h.startsWith("ssw")) return "ssw";
  if (String(state.level).startsWith("ir") || h.startsWith("jft")) return "jft";
  return "jlpt";
};
window.rangkumPopup = (prefilled = {}, sumber = "") => {
  const safe = (s) => (s||"").toString().replace(/"/g,"&quot;");
  const existing = document.getElementById("rangkum-modal");
  if (existing) existing.remove();
  const html = `
    <div class="modal-backdrop open" id="rangkum-modal" onclick="if(event.target===this) closeRangkumPopup()">
      <div class="modal">
        <h2>➕ Tambah ke Rangkuman ${RK_NAMA[_rkBidangDari(sumber)]}</h2>
        <p style="color:var(--gray); font-size:13px;">Catat kata yang mau kamu ulang-ulang nanti di menu Rangkuman.</p>
        ${sumber ? `<p style="font-size:12px; color:var(--gray-dim); background:rgba(255,255,255,.04); padding:8px 10px; border-radius:8px; margin-top:8px;">📍 Sumber: ${sumber}</p>` : ""}
        <div class="form-row" style="margin-top:14px;">
          <label>Kata (日本語)</label>
          <input id="rk-jp" value="${safe(prefilled.jp)}" placeholder="misal: 食べる" style="flex:1; font-family:var(--font-jp); font-size:20px;"/>
        </div>
        <div class="form-row">
          <label>Kana</label>
          <input id="rk-kana" value="${safe(prefilled.kana)}" placeholder="opsional, misal: たべる" style="flex:1;"/>
        </div>
        <div class="form-row">
          <label>Arti</label>
          <input id="rk-arti" value="${safe(prefilled.arti)}" placeholder="bahasa Indonesia" style="flex:1;"/>
        </div>
        <button class="btn ghost sm" onclick="rangkumAutoLookup()" style="margin-top:8px;">🔍 Cari otomatis di kamus SHIROSE</button>
        <div style="display:flex; gap:10px; margin-top:16px;">
          <button class="btn gold" onclick="rangkumSimpan('${safe(sumber)}')" style="flex:1;">💾 Simpan</button>
          <button class="btn ghost" onclick="closeRangkumPopup()">Batal</button>
        </div>
      </div>
    </div>`;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
  setTimeout(() => document.getElementById("rk-jp")?.focus(), 50);
};

window.closeRangkumPopup = () => { const m = document.getElementById("rangkum-modal"); if (m) m.remove(); };

window.rangkumAutoLookup = async () => {
  const jp = document.getElementById("rk-jp").value.trim();
  if (!jp) return toast("Isi kata dulu");
  // Search all levels across kosakata & kanji
  for (const lvl of ["n5","n4","n3","n2","n1"]){
    const kos = await loadMateri("kosakata", lvl);
    const m = kos.find(it => (it.kata || it.k) === jp);
    if (m){
      document.getElementById("rk-kana").value = m.kana || "";
      document.getElementById("rk-arti").value = m.arti || "";
      toast(`✓ Ditemukan: kosakata ${lvl.toUpperCase()} No.${String(m.no||"-").padStart(3,"0")}`);
      return;
    }
    const knj = await loadMateri("kanji", lvl);
    const mk = knj.find(it => (it.kanji || it.k) === jp);
    if (mk){
      document.getElementById("rk-kana").value = mk.kana || "";
      document.getElementById("rk-arti").value = mk.arti || "";
      toast(`✓ Ditemukan: kanji ${lvl.toUpperCase()} No.${String(mk.no||"-").padStart(3,"0")}`);
      return;
    }
  }
  toast("Tidak ditemukan — tulis arti sendiri ya");
};

window.rangkumSimpan = async (sumber) => {
  if (!state.user) return toast("Login dulu untuk menyimpan rangkuman");
  const jp = document.getElementById("rk-jp").value.trim();
  const kana = document.getElementById("rk-kana").value.trim();
  const arti = document.getElementById("rk-arti").value.trim();
  if (!jp) return toast("Kata tidak boleh kosong");
  try {
    const res = await FB.tambahRangkuman({ jp, kana, arti, sumber, bidang: _rkBidangDari(sumber) });
    if (res && res.synced === false){
      toast(`✓ "${jp}" tersimpan (offline — sync nanti)`);
    } else {
      toast(`✓ "${jp}" masuk ke rangkuman`);
    }
    closeRangkumPopup();
  } catch(e){ toast("❌ " + e.message); }
};

/* ========== RANGKUMAN view ========== */
// Behaves exactly like the Hafalan selection screen, but with the type
// locked to "rangkuman" so the student sees preview + modes + start btn
// for their own collection. Comes with a "🗑 Kelola kata" shortcut to
// delete entries from the collection.
async function renderRangkuman(bidang){
  bidang = (bidang === "ssw" || bidang === "jft" || bidang === "jlpt") ? bidang : (String(state.level).startsWith("ir") ? "jft" : "jlpt");
  state._rkBidang = bidang; state._rkRoute = RK_ROUTE[bidang];
  const NM = RK_NAMA[bidang];
  if (!state.user){
    return `<div class="panel"><h2>📒 Rangkuman ${NM}</h2>
      <div class="empty"><div class="emoji">🔒</div>Login dulu untuk menyimpan rangkuman.<br>
      <button class="btn" onclick="showAuthModal()">Masuk</button></div></div>`;
  }
  const list = await FB.listRangkuman(bidang);
  if (!list.length){
    return `<div class="panel"><h2>📒 Rangkuman ${NM}</h2>
      <div class="empty"><div class="emoji">📒</div>
        Belum ada kata di Rangkuman ${NM}.<br><br>
        Cara menambah:<br>
        <small style="color:var(--gray); line-height:1.8;">
        ${bidang === "ssw" ? `• Di materi SSW, ketuk tombol <b>📒＋</b> di samping poin / ringkasan<br>• Di pop-up kosakata SSW → tombol <b>➕ Rangkum</b>` : `• Buka detail Kosakata / Kanji → tombol <b>➕ Rangkum</b><br>
        • Setelah selesai ujian → tombol <b>➕ Rangkum</b> di tiap soal<br>
        • Dari contoh kalimat → tombol <b>➕ Rangkum</b>`}
        </small>
      </div></div>`;
  }
  // Preset state.hafalan to the rangkuman flow then reuse the hafalan
  // selection screen so UI stays identical.
  state.hafalan = state.hafalan || {};
  state.hafalan.tipe = "rangkuman";
  state.hafalan.range = "all";
  state.hafalan.filter = state.hafalan.filter || "all";
  state.hafalan.mode = state.hafalan.mode || "flashcard";
  state._rangkumanContext = true;
  return renderHafalanSelect();
}

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>t.remove(), 3100);
}
window.toast = toast;

function friendlyAuthError(e){
  const code = e && e.code ? e.code : "";
  if (code === "auth/invalid-credential" || code === "auth/wrong-password")
    return "Email atau password salah. Coba lagi.";
  if (code === "auth/user-not-found")
    return "Akun belum terdaftar. Silakan buat akun baru.";
  if (code === "auth/email-already-in-use")
    return "Email sudah terdaftar. Silakan masuk.";
  if (code === "auth/weak-password")
    return "Password terlalu pendek. Minimal 6 karakter.";
  if (code === "auth/invalid-email")
    return "Format email tidak valid.";
  if (code === "auth/network-request-failed")
    return "Gagal konek ke server. Cek koneksi internet kamu.";
  if (code === "auth/too-many-requests")
    return "Terlalu banyak percobaan. Coba lagi beberapa menit.";
  return (e && e.message) || "Gagal masuk. Coba lagi.";
}

window.hapusAkunRusak = async () => {

  const pwd = document.getElementById("auth-page-pwd")?.value || "";

  if (err) err.innerHTML = "";
  if (!email || !pwd){
    if (err) err.textContent = "Isi email + password dulu di form atas, baru tekan tombol ini.";
    return;
  }
  if (!confirm(`HAPUS akun ${email} secara permanen? Email akan bisa dipakai daftar ulang setelah ini.`)) return;
  try {
    // Step 1: login — ini supaya Firebase anggap sebagai "recent login"
    try { await FB.login(email, pwd); }
    catch(e){
      if (err) err.textContent = "Login gagal (" + friendlyAuthError(e) + "). Pastikan password benar, lalu coba lagi.";

/* ========== LEVEL PILLS ========== */
function renderLevelPills(){
  // Tombol ganti N5–N1 dihapus dari topbar. Yang tampil hanya lencana level
  // aktif; ganti level harus lewat halaman pemilihan JLPT (#pilih-level).
  const pills = document.getElementById("lvl-pills");
  if (!pills) return;
  if (!state.user || !levelSudahDipilih()){ pills.innerHTML = ""; return; }
  pills.innerHTML = `<button class="lvl-badge" onclick="route('pilih-level')" title="Ganti level di halaman pemilihan JLPT">${window.levelLabel(state.level)} <span class="ganti">GANTI LEVEL</span></button>`;
  return;
  const levels = ["n5","n4","n3","n2","n1"];
  // Level yang belum dibuka guru ditandai gembok. Validasi sebenarnya ada
  // di Firestore Rules (soal & choukai hanya bisa dibaca bila aksesLevel aktif).
  pills.innerHTML = levels.map(l => {
    const active = state.level === l;
    const ok = canAccessLevel(l);
    return `<button class="lvl-pill ${active?'active':''} ${ok?'':'locked'}" style="${ok?'':'opacity:.45;'}" title="${ok?'':'Belum dibuka guru'}" onclick="setLevel('${l}')">${ok?'':'🔒'}${l.toUpperCase()}</button>`;
  }).join("");
}
// Akses JLPT per siswa (field siswa.aksesLevel, diatur guru di teacher.html).
// Harus login dengan akun terdaftar; guru/moderator bisa membuka semua level.
function canAccessLevel(lvl){
  if (!lvl) return false;
  if (!state.user) return false;
  if (FB.userIsGuru()) return true;
  if (String(lvl).startsWith("ir")) return state.siswa?.aksesJft !== false && state.siswa?.aksesJftLevel?.[lvl] !== false;   // JFT (Irodori): terbuka kecuali guru menutup (siswa.aksesJft === false)
  const akses = state.siswa?.aksesLevel;
  return !!(akses && akses[lvl]);
}
window.canAccessLevel = canAccessLevel;

window.setLevel = async (lvl) => {
  if (state.user){ return window.pilihLevel(lvl); }
  if (!canAccessLevel(lvl)){
    if (!state.user){ toast("🔑 Masuk dulu dengan akun dari guru"); route("login"); return; }
    toast("🔒 Level " + lvl.toUpperCase() + " belum dibuka — hubungi guru untuk akses");
    return;
  }
  state.level = lvl;
  localStorage.setItem("shirose-lvl", lvl);
  renderLevelPills();
  await loadGami();
  updateChips();
  route(location.hash.slice(1) || "home");
};

// Snap state.level back to a level the student is allowed to use. Called
// after the siswa doc loads, and defensively before any level-scoped render.
function enforceLevelAccess(){
  if (canAccessLevel(state.level)) return true;
  const akses = state.siswa?.aksesLevel || {};
  const first = ["n5","n4","n3","n2","n1"].find(l => akses[l]) || "n5";
  if (first !== state.level){
    state.level = first;
    localStorage.setItem("shirose-lvl", first);
    renderLevelPills();
  }
  return false;
}
window.enforceLevelAccess = enforceLevelAccess;

/* ========== GAMI (XP/koin) ========== */
async function loadGami(){
  if (!state.user) {
    // Guest from localStorage
    const key = `shirose-gami-${state.level}`;
    state.gami = JSON.parse(localStorage.getItem(key) || '{"xp":0,"koin":0,"streak":0,"level_karakter":1}');
    if (window.SHIROSE_THEME) window.SHIROSE_THEME.refresh();
    return;
  }
  state.gami = await FB.getGami(state.level);
  try { if (FB.syncGachaInventory) FB.syncGachaInventory(id => Object.values(CATALOG).some(o => o && o[id])); } catch (e) {}   // hadiah gacha di perangkat → inventaris akun
  try { const g = FB.getGachaState ? await FB.getGachaState() : null; if (window.SHIROSE_THEME) window.SHIROSE_THEME.setOwned(g && g.inv || []); } catch (e) {}
}
async function awardXP(dXP, dKoin = 0){
  const oldLvl = state.gami.level_karakter || 1;
  if (state.user) {
    state.gami = await FB.tambahXP(state.level, dXP, dKoin);
  } else {
    state.gami.xp = (state.gami.xp || 0) + dXP;
    state.gami.koin = (state.gami.koin || 0) + dKoin;
    state.gami.level_karakter = Math.floor(Math.sqrt(state.gami.xp / 50)) + 1;
    const today = new Date().toISOString().slice(0,10);
    if (state.gami.lastDate !== today) {
      const yd = new Date(Date.now()-86400000).toISOString().slice(0,10);

window.closeTopOverlay = () => {
  const cand = [];

    const cs = getComputedStyle(el);
    if (cs.display === "none" || cs.visibility === "hidden") return;
    cand.push({ el, z: parseInt(cs.zIndex, 10) || 0, close });
  });
  add("#sw-figlb", el => { const x = el.querySelector(".x"); x ? x.click() : el.remove(); });
  add("#sw-lb", el => { const x = el.querySelector('[data-a="x"]'); x ? x.click() : el.remove(); });
  add("#sw-vs:not([hidden])", () => window.SSW && window.SSW.vclose());

  add(".jx-modal", el => { const n = el.querySelector("[data-no]"); n ? n.click() : el.remove(); });
  add("#kc-modal", el => el.click());
  add(".modal-backdrop.open", el => { el.click(); if (document.body.contains(el) && el.classList.contains("open")) el.classList.remove("open"); });
  add("#sw-prefs:not([hidden])", el => { el.hidden = true; });
  add("#sw-chara-ov", el => el.remove());
  if (!cand.length) return false;
  cand.sort((a, b) => b.z - a.z);

window.goBack = () => {

  if (window._materiDetail && (location.hash.slice(1) || "") === window._materiDetail.back){ window.backFromDetail(); return; }
  const here = location.hash.slice(1) || "home";
  const cur = here.split("/")[0];
  const sub = _subjectOf(here);
  const st = window._routeStack;
  if (window.__sswBack && /^(shop|gacha|profile)$/.test(cur)){ const b = window.__sswBack; window.__sswBack = null; route(b); return; }
  if (sub !== "jlpt"){
    // Mundur tepat 1 halaman di mapel yang sama; kalau riwayat habis/beda mapel → halaman induk (bukan pemilihan JLPT).
    let i = st.length - 1;
    while (i >= 0 && (st[i] === here || (cur === "ssw-buku" && String(st[i]).startsWith("ssw-buku")))) i--;
    const prev = i >= 0 ? st[i] : null;
    window._routeStack = st.slice(0, Math.max(0, i));
    if (prev && _subjectOf(prev) === sub && prev !== here){ route(prev); return; }
    route(_parentOf(here) || "pilih-level"); return;
  }
  if (cur === "home" && state.user){ route("pilih-level"); return; }
  if (st.length >= 2){
    st.pop();                // remove current
    const prev = st.pop();   // remove previous (route() will push it back)
    if (_subjectOf(prev) !== "jlpt"){ route("home"); return; }
    route(prev);
    return;
  }
  route("home");
};

window.route = (path) => {

  { const _n = path.split("/")[0], _h = location.hash.slice(1) || "";

  // Track in history stack unless it's a duplicate of the top.
  const top = window._routeStack[window._routeStack.length - 1];

async function _fillHomeCalendar(){
  const host = document.getElementById("home-cal-body");
  if (!host) return;
  const now = new Date();
  const ymKey = now.getFullYear() + String(now.getMonth()+1).padStart(2,"0");

  // Streaks + this month's activity (both robust against missing rules).
  let activity = {};
  let streak = 0, longest = 0;
  if (state.user){
    activity = await FB.listActivity(ymKey).catch(() => ({}));
    try { [streak, longest] = await _computeStreaks(); }
    catch { streak = 0; longest = 0; }
  }

  // Monthly totals
  const totals = { kanji:0, kosakata:0, latihan:0, ujian:0, days:0 };
  Object.values(activity).forEach(a => {
    totals.kanji += a.kanji||0; totals.kosakata += a.kosakata||0;
    totals.latihan += a.latihan||0; totals.ujian += a.ujian||0;
    if ((a.kanji||0)+(a.kosakata||0)+(a.latihan||0)+(a.ujian||0) > 0) totals.days++;
  });

  // Build the mini grid: 7 columns, current month only
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const last  = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const startWd = first.getDay();
  const totalDays = last.getDate();
  const cells = [];
  const prevLast = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
  for (let i = startWd; i > 0; i--) cells.push({ d: prevLast - i + 1, other:true });
  for (let d = 1; d <= totalDays; d++){
    const ymd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(d).padStart(2,"0")}`;
    cells.push({ d, ymd, a: activity[ymd] || null });
  }
  while (cells.length % 7 !== 0) cells.push({ other:true, d:"" });

  const todayYmd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}`;
  const monthName = first.toLocaleString("id-ID", { month:"long", year:"numeric" });

  // Heat intensity map:
  //   0  -> no color (belum dikerjakan)
  //   1  -> green  (sedikit, 1-19 item)
  //   2  -> yellow (sedang, 20-49)
  //   3  -> orange (lumayan, 50-149)
  //   4  -> red    (bagus, 150-299)
  //   5  -> fire🔥 (brutal, 300+)
  const intensityOf = (a) => {
    if (!a) return 0;
    const total = (a.kanji||0)+(a.kosakata||0)+(a.latihan||0)+(a.ujian||0);
    if (total === 0) return 0;
    if (total < 20) return 1;
    if (total < 50) return 2;
    if (total < 150) return 3;
    if (total < 300) return 4;
    return 5;
  };
  const cellHtml = (c) => {
    if (c.other) return `<div class="mini-cell other"><span class="d">${c.d||""}</span></div>`;
    const a = c.a;
    const intensity = intensityOf(a);
    const isToday = c.ymd === todayYmd ? " today" : "";
    const cls = intensity ? ` i${intensity}` : "";
    const payload = encodeURIComponent(JSON.stringify({ ymd:c.ymd, a:a||{} }));
    const fire = intensity === 5 ? `<span class="cell-fire">🔥</span>` : "";
    return `<div class="mini-cell${cls}${isToday}" onclick="miniCalDay('${payload}')"><span class="d">${c.d}</span>${fire}</div>`;
  };

  host.innerHTML = `
    <div class="streak-row">
      <div class="streak-pill fire">
        <span class="ico">🔥</span>
        <div><div class="num">${streak}</div><div class="lbl">Streak saat ini</div></div>
      </div>
      <div class="streak-pill trophy">
        <span class="ico">🏆</span>
        <div><div class="num">${longest}</div><div class="lbl">Terpanjang</div></div>
      </div>
      <div class="streak-pill book">
        <span class="ico">📚</span>
        <div><div class="num">${totals.days}</div><div class="lbl">Hari belajar</div></div>
      </div>
    </div>

    <div class="mini-cal-head">
      <b>${monthName}</b>
      <button class="btn ghost sm" onclick="route('kalender')">Lihat Detail →</button>
    </div>

    <div class="mini-cal">
      ${["M","S","S","R","K","J","S"].map(w => `<div class="mini-head">${w}</div>`).join("")}
      ${cells.map(cellHtml).join("")}
    </div>

    <div class="heat-legend">
      <span><i class="sw"></i>Belum</span>
      <span><i class="sw i1"></i>1–19</span>
      <span><i class="sw i2"></i>20–49</span>
      <span><i class="sw i3"></i>50–149</span>
      <span><i class="sw i4"></i>150–299</span>
      <span><i class="sw i5"></i>300+ 🔥</span>
    </div>

    <div class="mini-totals">
      <span>🈷️ ${totals.kanji} kanji</span>
      <span>📖 ${totals.kosakata} kosakata</span>
      <span>🧠 ${totals.latihan} latihan</span>
      <span>📝 ${totals.ujian} ujian</span>
    </div>
  `;
}
